<script>
document.querySelectorAll('input[name="booster"]').forEach(function(cb){
  cb.addEventListener('change', function(){
    var total = 0;
    document.querySelectorAll('input[name="booster"]:checked').forEach(function(c){ total += parseInt(c.value); });
    document.getElementById('boosterAmount').textContent = 'US$' + total;
    document.getElementById('boosterTotal').textContent = total > 0 ? 'Selected boosters total' : 'Select boosters above';
    var selected = [];
    document.querySelectorAll('input[name="booster"]:checked').forEach(function(c){ selected.push({label:c.dataset.label,value:c.value}); });
    sessionStorage.setItem('selectedBoosters', JSON.stringify(selected));
    sessionStorage.setItem('boosterTotal', total);
  });
});
function proceedToCheckout(){
  var total = parseInt(sessionStorage.getItem('boosterTotal') || '0');
  if(total === 0){ alert('Please select at least one booster.'); return; }
  window.location.href = 'checkout-boosters.html';
}
